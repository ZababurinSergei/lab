<svg id="flowchart" width="980" height="1220" viewBox="0 0 980 1220" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Стрелка вверх (для линии снизу вверх) -->
        <marker id="arrowUp" markerWidth="12" markerHeight="12" refX="6" refY="0" orient="0">
            <polygon points="0,12 6,0 12,12" fill="#1f5e55" stroke="none" />
        </marker>
        <!-- Стрелка влево (для линии справа налево) -->
        <marker id="arrowLeft" markerWidth="12" markerHeight="12" refX="0" refY="6" orient="0">
            <polygon points="12,0 0,6 12,12" fill="#b1624b" stroke="none" />
        </marker>
    </defs>

    <!-- =========== 1. НАЧАЛО =========== -->
    <rect x="380" y="20" width="200" height="46" rx="23" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="480" y="49" font-size="18" font-weight="bold" fill="#1c534f" text-anchor="middle">НАЧАЛО</text>
    <line x1="480" y1="66" x2="480" y2="102" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 2. Ввод данных =========== -->
    <polygon points="360,102 600,102 560,152 320,152" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="134" font-size="15" font-weight="bold" text-anchor="middle">Ввод x, ε, max_iter</text>
    <line x1="460" y1="152" x2="460" y2="188" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 3. Инициализация =========== -->
    <rect x="330" y="188" width="260" height="52" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="214" font-size="15" font-weight="bold" text-anchor="middle">S = 0.0 ;  k = 1</text>
    <line x1="460" y1="240" x2="460" y2="278" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 4. Вычисление знаменателя и аргумента =========== -->
    <rect x="280" y="278" width="360" height="56" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="300" font-size="13" font-weight="bold" text-anchor="middle">denom = (2k-1)²·π²</text>
    <text x="460" y="322" font-size="13" font-weight="bold" text-anchor="middle">arg = 1 – 4·x² / denom</text>
    <line x1="460" y1="334" x2="460" y2="372" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 5. Ромб: arg ≤ 0 ? =========== -->
    <polygon points="460,372 600,422 460,472 320,422" fill="white" stroke="#b1624b" stroke-width="2" />
    <text x="460" y="428" font-size="15" font-weight="bold" fill="#b1624b" text-anchor="middle">arg ≤ 0 ?</text>

    <!-- Ветка "ДА" -->
    <line x1="600" y1="422" x2="680" y2="422" stroke="#b1624b" stroke-width="2" />
    <text x="640" y="414" font-size="15" fill="#b45f2e" font-weight="bold">Да</text>
    <rect x="682" y="398" width="230" height="48" rx="8" fill="white" stroke="#b1624b" stroke-width="2" />
    <text x="797" y="418" font-size="13" font-weight="bold" fill="#b45f2e" text-anchor="middle">Ошибка: аргумент ≤ 0</text>
    <text x="797" y="437" font-size="13" fill="#b45f2e" text-anchor="middle">(ряд расходится)</text>

    <!-- Аварийная ветка к КОНЦУ (справа налево, стрелка влево) -->
    <line x1="797" y1="446" x2="797" y2="1112" stroke="#b1624b" stroke-width="2" stroke-dasharray="6,4" />
    <line x1="797" y1="1112" x2="620" y2="1112" stroke="#b1624b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowLeft)" />
    <text x="810" y="1065" font-size="12" fill="#b45f2e" font-style="italic">аварийный выход</text>

    <!-- Ветка "НЕТ" -->
    <line x1="460" y1="472" x2="460" y2="514" stroke="#1f5e55" stroke-width="2" />
    <text x="395" y="496" font-size="15" fill="#1f5e55" font-weight="bold">Нет</text>

    <!-- =========== 6. term = ln(arg) =========== -->
    <rect x="330" y="514" width="260" height="48" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="540" font-size="15" font-weight="bold" text-anchor="middle">term = ln(arg)</text>
    <line x1="460" y1="562" x2="460" y2="600" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 7. S = S + term =========== -->
    <rect x="330" y="600" width="260" height="48" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="626" font-size="15" font-weight="bold" text-anchor="middle">S = S + term</text>
    <line x1="460" y1="648" x2="460" y2="686" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 8. Вывод промежуточных значений =========== -->
    <polygon points="350,686 570,686 530,726 310,726" fill="white" stroke="#4f7a72" stroke-width="2" />
    <text x="440" y="712" font-size="13" font-weight="bold" fill="#2f6b62" text-anchor="middle">Вывод k, term, S</text>
    <line x1="440" y1="726" x2="440" y2="764" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 9. k = k + 1 =========== -->
    <rect x="330" y="764" width="260" height="48" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="790" font-size="15" font-weight="bold" text-anchor="middle">k = k + 1</text>
    <line x1="460" y1="812" x2="460" y2="850" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 10. Условие продолжения цикла =========== -->
    <polygon points="460,850 620,900 460,950 300,900" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="460" y="895" font-size="14" font-weight="bold" text-anchor="middle">|term| ≥ ε и</text>
    <text x="460" y="914" font-size="14" font-weight="bold" text-anchor="middle">k ≤ max_iter ?</text>

    <!-- Ветка "ДА" – возврат к вычислениям -->
    <line x1="300" y1="900" x2="200" y2="900" stroke="#1f5e55" stroke-width="2" />
    <text x="225" y="888" font-size="15" fill="#1f5e55" font-weight="bold">Да</text>

    <!-- Линия возврата (снизу вверх, стрелка вверх) -->
    <line x1="200" y1="900" x2="200" y2="306" stroke="#1f5e55" stroke-width="2" marker-end="url(#arrowUp)" />

    <!-- Дуга-мостик для обхода блока вычислений -->
    <path d="M 200,420 Q 230,420 230,400 Q 230,380 200,380" fill="none" stroke="#1f5e55" stroke-width="2" stroke-linecap="round" />
    <line x1="200" y1="380" x2="200" y2="306" stroke="#1f5e55" stroke-width="2" />
    <line x1="200" y1="900" x2="200" y2="420" stroke="#1f5e55" stroke-width="2" />

    <!-- Соединение к блоку вычислений -->
    <line x1="200" y1="306" x2="278" y2="306" stroke="#1f5e55" stroke-width="2" />

    <!-- Ветка "НЕТ" – выход из цикла -->
    <line x1="620" y1="900" x2="710" y2="900" stroke="#1f5e55" stroke-width="2" />
    <text x="665" y="888" font-size="15" fill="#1f5e55" font-weight="bold">Нет</text>
    <line x1="710" y1="900" x2="710" y2="998" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 11. Вывод итогового результата =========== -->
    <polygon points="540,998 740,998 700,1048 500,1048" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="620" y="1028" font-size="15" font-weight="bold" text-anchor="middle">Вывод S, число членов</text>
    <line x1="620" y1="1048" x2="620" y2="1088" stroke="#1f5e55" stroke-width="2" />

    <!-- =========== 12. КОНЕЦ =========== -->
    <rect x="520" y="1088" width="200" height="46" rx="23" fill="white" stroke="#1c534f" stroke-width="2" />
    <text x="620" y="1117" font-size="18" font-weight="bold" fill="#1c534f" text-anchor="middle">КОНЕЦ</text>

    <!-- Рамка тела цикла -->
    <rect x="140" y="260" width="580" height="710" rx="20" fill="none" stroke="#2a6b66" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.45" />
    <text x="150" y="280" font-size="12" fill="#2a6b66" font-style="italic">Тело цикла</text>

    <!-- Легенда -->
    <text x="30" y="1180" font-size="11" fill="#5a7c75" font-style="italic">Примечание: стрелки поставлены только для нестандартного направления потока (снизу вверх, справа налево) согласно ГОСТ 19.701-90</text>
    <text x="30" y="1198" font-size="11" fill="#5a7c75" font-style="italic">Пересечение линии возврата с блоком вычислений оформлено дугой (мостик) — линия не прерывается</text>
</svg>