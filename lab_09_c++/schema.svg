<svg width="900" height="1050" viewBox="0 0 900 1050" xmlns="http://www.w3.org/2000/svg" style="font-family: 'Times New Roman', serif;">
    <defs>
        <marker id="arrow" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
            <path d="M0,0 L5,2.5 L0,5 Z" fill="black"/>
        </marker>
        <marker id="arrow-left" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto">
            <path d="M5,0 L0,2.5 L5,5 Z" fill="black"/>
        </marker>
    </defs>

    <!-- ===== 1. НАЧАЛО ===== -->
    <rect x="340" y="8" width="120" height="28" rx="14" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="400" y="27" text-anchor="middle" font-size="11" font-weight="bold">Начало</text>
    <line x1="400" y1="36" x2="400" y2="55" stroke="black" stroke-width="1.2"/>

    <!-- ===== 2. ВВОД РАЗМЕРА ===== -->
    <polygon points="340,55 460,55 430,85 310,85" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="385" y="75" text-anchor="middle" font-size="10" font-style="italic">Ввод n</text>
    <line x1="400" y1="85" x2="400" y2="110" stroke="black" stroke-width="1.2"/>

    <!-- ===== 3. ПРОВЕРКА n > 0 ===== -->
    <polygon points="400,110 470,140 400,170 330,140" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="400" y="145" text-anchor="middle" font-size="10" font-style="italic">n &gt; 0</text>

    <!-- Ложь -->
    <line x1="330" y1="140" x2="270" y2="140" stroke="black" stroke-width="1.2"/>
    <line x1="270" y1="140" x2="270" y2="185" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="300" y="135" font-size="9" fill="#b44">Ложь</text>
    <rect x="210" y="185" width="120" height="28" rx="14" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="270" y="204" text-anchor="middle" font-size="10" font-weight="bold">Конец</text>

    <!-- Истина -->
    <line x1="400" y1="170" x2="400" y2="195" stroke="black" stroke-width="1.2"/>
    <text x="415" y="185" font-size="9" fill="#1a6b5e">Истина</text>

    <!-- ===== 4. ВЫДЕЛЕНИЕ ПАМЯТИ ===== -->
    <rect x="240" y="195" width="320" height="55" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="400" y="213" text-anchor="middle" font-size="9" font-style="italic">Выделение памяти под матрицу n×n</text>
    <text x="400" y="228" text-anchor="middle" font-size="8">(malloc для строк и столбцов)</text>
    <text x="400" y="243" text-anchor="middle" font-size="8">с проверкой успешности</text>
    <line x1="400" y1="250" x2="400" y2="275" stroke="black" stroke-width="1.2"/>

    <!-- ===== 5. mode = 0 ===== -->
    <rect x="340" y="275" width="120" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="400" y="294" text-anchor="middle" font-size="10" font-style="italic">mode = 0</text>
    <line x1="400" y1="303" x2="400" y2="325" stroke="black" stroke-width="1.2"/>

    <!-- ===== 6. МЕНЮ (ромб) ===== -->
    <polygon points="400,325 490,360 400,395 310,360" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="400" y="365" text-anchor="middle" font-size="10" font-style="italic">Выбор</text>

    <!-- choice = 0 (выход) -->
    <line x1="310" y1="360" x2="230" y2="360" stroke="black" stroke-width="1.2"/>
    <line x1="230" y1="360" x2="230" y2="800" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="270" y="353" font-size="9" fill="#b44">0</text>

    <!-- choice = 1-5 -->
    <line x1="490" y1="360" x2="560" y2="360" stroke="black" stroke-width="1.2"/>
    <line x1="560" y1="360" x2="560" y2="395" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="525" y="353" font-size="9" fill="#1a6b5e">1,2,3,4,5</text>

    <!-- Выполнение действия -->
    <rect x="460" y="395" width="200" height="40" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="560" y="412" text-anchor="middle" font-size="9" font-style="italic">Выполнение выбранного</text>
    <text x="560" y="426" text-anchor="middle" font-size="8" font-style="italic">действия</text>
    <line x1="560" y1="435" x2="560" y2="470" stroke="black" stroke-width="1.2"/>

    <!-- Обновление mode -->
    <rect x="480" y="470" width="160" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="560" y="489" text-anchor="middle" font-size="9" font-style="italic">mode = 1 или 2</text>
    <line x1="560" y1="498" x2="560" y2="530" stroke="black" stroke-width="1.2"/>

    <!-- ===== 7. ПРОВЕРКА mode != 0 ===== -->
    <polygon points="560,530 630,560 560,590 490,560" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="560" y="565" text-anchor="middle" font-size="9" font-style="italic">mode ≠ 0</text>

    <!-- Истина -> к соединителю A -->
    <line x1="630" y1="560" x2="720" y2="560" stroke="black" stroke-width="1.2"/>
    <line x1="720" y1="560" x2="720" y2="610" stroke="black" stroke-width="1.2"/>
    <text x="675" y="553" font-size="9" fill="#1a6b5e">Истина</text>

    <!-- Ложь -> ошибка -> к соединителю A -->
    <line x1="490" y1="560" x2="440" y2="560" stroke="black" stroke-width="1.2"/>
    <line x1="440" y1="560" x2="440" y2="600" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="465" y="553" font-size="9" fill="#b44">Ложь</text>

    <rect x="350" y="600" width="180" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="440" y="619" text-anchor="middle" font-size="8" font-style="italic">"Матрица не заполнена"</text>
    <line x1="440" y1="628" x2="440" y2="645" stroke="black" stroke-width="1.2"/>

    <!-- ===== СОЕДИНИТЕЛЬ A (точка слияния) ===== -->
    <circle cx="440" cy="645" r="8" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="440" y="649" text-anchor="middle" font-size="8" font-weight="bold">A</text>

    <!-- Линия от Истина к соединителю A -->
    <line x1="720" y1="610" x2="720" y2="645" stroke="black" stroke-width="1.2"/>
    <line x1="720" y1="645" x2="448" y2="645" stroke="black" stroke-width="1.2" marker-end="url(#arrow-left)"/>

    <!-- Выход из соединителя A вниз к блоку освобождения? НЕТ, это возврат к меню -->
    <!-- Но возврат к меню не может идти вниз, так как меню выше -->
    <!-- Значит, соединитель A должен быть связан с соединителем у меню -->

    <!-- ===== СОЕДИНИТЕЛЬ A2 (у блока Выбор) ===== -->
    <circle cx="400" cy="318" r="8" fill="white" stroke="black" stroke-width="1.5"/>
    <text x="400" y="322" text-anchor="middle" font-size="8" font-weight="bold">A</text>

    <!-- Соединитель A2 связан с входом в блок Выбор -->
    <line x1="400" y1="326" x2="400" y2="325" stroke="black" stroke-width="1.2"/>

    <!-- Соединяем A (внизу) с A2 (вверху) через правую сторону -->
    <!-- Линия от A идёт вправо, затем вверх, затем влево к A2 -->
    <line x1="448" y1="645" x2="780" y2="645" stroke="black" stroke-width="1.2"/>
    <line x1="780" y1="645" x2="780" y2="200" stroke="black" stroke-width="1.2"/>
    <line x1="780" y1="200" x2="408" y2="200" stroke="black" stroke-width="1.2" marker-end="url(#arrow-left)"/>
    <line x1="408" y1="200" x2="408" y2="310" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ===== 8. ОСВОБОЖДЕНИЕ ПАМЯТИ ===== -->
    <rect x="100" y="800" width="220" height="35" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="210" y="818" text-anchor="middle" font-size="9" font-style="italic">Освобождение памяти</text>
    <text x="210" y="830" text-anchor="middle" font-size="8">(free строк и указателей)</text>
    <line x1="210" y1="835" x2="210" y2="860" stroke="black" stroke-width="1.2"/>

    <rect x="100" y="860" width="220" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="210" y="880" text-anchor="middle" font-size="9" font-style="italic">free(matrix[i]) для i=0..n-1</text>
    <line x1="210" y1="888" x2="210" y2="910" stroke="black" stroke-width="1.2"/>

    <rect x="100" y="910" width="220" height="28" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="210" y="930" text-anchor="middle" font-size="9" font-style="italic">free(matrix)</text>
    <line x1="210" y1="938" x2="210" y2="965" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Конец -->
    <rect x="150" y="965" width="120" height="28" rx="14" fill="white" stroke="black" stroke-width="1.2"/>
    <text x="210" y="984" text-anchor="middle" font-size="10" font-weight="bold">Конец</text>
</svg>