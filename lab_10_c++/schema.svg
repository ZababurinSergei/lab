<svg width="780" height="1200" viewBox="0 0 780 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowUp" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
        </marker>
        <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="black"/>
        </marker>
    </defs>

    <!-- ============================================ -->
    <!-- 1. НАЧАЛО (y=20..65) -->
    <!-- ============================================ -->
    <rect x="300" y="20" width="180" height="45" rx="22" fill="white" stroke="black" stroke-width="2"/>
    <text x="390" y="50" font-size="20" font-weight="bold" text-anchor="middle">НАЧАЛО</text>

    <!-- Линия от НАЧАЛА к ВВОДУ (y=65 → y=105) -->
    <line x1="390" y1="65" x2="390" y2="105" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 2. ВВОД str, ch (параллелограмм y=105..155) -->
    <!-- ============================================ -->
    <polygon points="300,105 480,105 460,155 280,155" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="132" font-size="15" font-style="italic" text-anchor="middle">Ввод str, ch</text>

    <!-- Линия от ВВОДА к ИНИЦИАЛИЗАЦИИ (y=155 → y=195) -->
    <line x1="380" y1="155" x2="380" y2="195" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 3. ИНИЦИАЛИЗАЦИЯ (y=195..250) -->
    <!-- ============================================ -->
    <rect x="250" y="195" width="260" height="55" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="220" font-size="14" font-style="italic" text-anchor="middle">i = 0; j = 0;</text>
    <text x="380" y="240" font-size="14" font-style="italic" text-anchor="middle">len = strlen(str)</text>

    <!-- Линия от ИНИЦИАЛИЗАЦИИ к РОМБУ (y=250 → y=290) -->
    <line x1="380" y1="250" x2="380" y2="290" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 4. РОМБ "i < len ?" (y=290..400) -->
    <!-- ============================================ -->
    <polygon points="380,290 510,345 380,400 250,345" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="350" font-size="17" font-weight="bold" font-style="italic" text-anchor="middle">i &lt; len</text>

    <!-- НЕТ → выход вправо, затем вниз к схлопыванию -->
    <line x1="510" y1="345" x2="620" y2="345" stroke="black" stroke-width="2" marker-end="url(#arrowRight)"/>
    <text x="565" y="335" font-size="14" fill="#1a6b5e" text-anchor="middle">НЕТ</text>
    <line x1="620" y1="345" x2="620" y2="960" stroke="black" stroke-width="2"/>

    <!-- ДА → вниз в тело цикла -->
    <line x1="380" y1="400" x2="380" y2="440" stroke="black" stroke-width="2"/>
    <text x="350" y="425" font-size="14" fill="#1a6b5e" text-anchor="end">ДА</text>

    <!-- ============================================ -->
    <!-- 5. ПРОПУСК ПРОБЕЛОВ (y=440..485) -->
    <!-- ============================================ -->
    <rect x="240" y="440" width="280" height="45" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="468" font-size="14" font-style="italic" text-anchor="middle">Пропуск пробелов</text>

    <line x1="380" y1="485" x2="380" y2="525" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 6. word_start, поиск конца слова (y=525..575) -->
    <!-- ============================================ -->
    <rect x="240" y="525" width="280" height="50" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="548" font-size="14" font-style="italic" text-anchor="middle">word_start = i</text>
    <text x="380" y="565" font-size="14" font-style="italic" text-anchor="middle">while (str[i] != ' ') i++</text>

    <line x1="380" y1="575" x2="380" y2="615" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 7. РОМБ "str[word_start] == ch ?" (y=615..725) -->
    <!-- ============================================ -->
    <polygon points="380,615 510,670 380,725 250,670" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="678" font-size="14" font-weight="bold" font-style="italic" text-anchor="middle">str[word_start]</text>
    <text x="380" y="695" font-size="14" font-weight="bold" font-style="italic" text-anchor="middle">== ch ?</text>

    <!-- ДА → пропуск (вправо) -->
    <line x1="510" y1="670" x2="620" y2="670" stroke="black" stroke-width="2" marker-end="url(#arrowRight)"/>
    <text x="565" y="658" font-size="14" fill="#b44" text-anchor="middle">ДА</text>

    <!-- НЕТ → копирование (вниз) -->
    <line x1="380" y1="725" x2="380" y2="765" stroke="black" stroke-width="2"/>
    <text x="350" y="750" font-size="14" fill="#1a6b5e" text-anchor="end">НЕТ</text>

    <!-- ============================================ -->
    <!-- 8. КОПИРОВАНИЕ СЛОВА (y=765..815) -->
    <!-- ============================================ -->
    <rect x="240" y="765" width="280" height="50" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="795" font-size="14" font-style="italic" text-anchor="middle">Скопировать слово в result</text>

    <!-- ============================================ -->
    <!-- 9. ВОЗВРАТ К РОМБУ i < len (В ОБХОД БЛОКОВ) -->
    <!-- ============================================ -->
    <!-- От блока "копирование" (y=790, x=240) → влево до x=70, затем вверх до y=320, затем в ромб -->
    <line x1="240" y1="790" x2="70" y2="790" stroke="black" stroke-width="2"/>
    <line x1="70" y1="790" x2="70" y2="320" stroke="black" stroke-width="2"/>
    <line x1="70" y1="320" x2="243" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrowUp)"/>

    <!-- От ветки "ДА" (пропуск): от x=620,y=670 → вниз до y=790 → влево до x=130 → вверх до y=320 → в ромб -->
    <line x1="620" y1="670" x2="620" y2="790" stroke="black" stroke-width="2"/>
    <line x1="620" y1="790" x2="130" y2="790" stroke="black" stroke-width="2"/>
    <line x1="130" y1="790" x2="130" y2="320" stroke="black" stroke-width="2"/>
    <line x1="130" y1="320" x2="243" y2="320" stroke="black" stroke-width="2" marker-end="url(#arrowUp)"/>

    <!-- ============================================ -->
    <!-- 10. СХЛОПЫВАНИЕ ПРОБЕЛОВ (y=960..1005) -->
    <!-- ============================================ -->
    <!-- Линия от выхода НЕТ (x=620,y=345) спускается к этому блоку -->
    <rect x="240" y="960" width="280" height="45" fill="white" stroke="black" stroke-width="2"/>
    <text x="380" y="988" font-size="14" font-style="italic" text-anchor="middle">Схлопывание лишних пробелов</text>

    <!-- Соединение от x=620,y=960 к блоку (левый верхний угол x=240) -->
    <line x1="620" y1="960" x2="520" y2="960" stroke="black" stroke-width="2"/>
    <line x1="520" y1="960" x2="520" y2="982" stroke="black" stroke-width="2"/>

    <line x1="380" y1="1005" x2="380" y2="1045" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 11. ВЫВОД result (y=1045..1085) -->
    <!-- ============================================ -->
    <polygon points="295,1045 465,1045 445,1085 275,1085" fill="white" stroke="black" stroke-width="2"/>
    <text x="370" y="1070" font-size="14" font-style="italic" text-anchor="middle">Вывод final_result</text>

    <line x1="370" y1="1085" x2="370" y2="1120" stroke="black" stroke-width="2"/>

    <!-- ============================================ -->
    <!-- 12. КОНЕЦ (y=1120..1165) -->
    <!-- ============================================ -->
    <rect x="300" y="1120" width="180" height="45" rx="22" fill="white" stroke="black" stroke-width="2"/>
    <text x="390" y="1150" font-size="20" font-weight="bold" text-anchor="middle">КОНЕЦ</text>

    <!-- ============================================ -->
    <!-- ПОДПИСЬ -->
    <!-- ============================================ -->
    <text x="390" y="1195" font-size="16" text-anchor="middle" fill="#1a4d47">Рисунок 1 – Блок-схема алгоритма (вариант 9)</text>

</svg>