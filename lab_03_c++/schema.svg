<svg width="720" height="1250" viewBox="0 0 720 1250" xmlns="http://www.w3.org/2000/svg">

    <defs>
        <marker id="arrowRight" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8 Z" fill="#1a2c2a"></path>
        </marker>
    </defs>

    <!-- ===== 1. НАЧАЛО ===== -->
    <rect x="210" y="15" width="200" height="42" rx="21" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="310" y="42" text-anchor="middle" font-size="16" font-family="'Times New Roman',serif" font-weight="bold">НАЧАЛО</text>
    <line x1="310" y1="57" x2="310" y2="90" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 2. ВВОД ===== -->
    <polygon points="220,90 400,90 380,135 200,135" fill="white" stroke="#1a2c2a" stroke-width="2"></polygon>
    <text x="300" y="120" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">Ввод x, a, b</text>
    <line x1="300" y1="135" x2="300" y2="175" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 3. РОМБ: a == 0 ? ===== -->
    <polygon points="300,175 430,235 300,295 170,235" fill="white" stroke="#1a2c2a" stroke-width="2"></polygon>
    <text x="300" y="242" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">a == 0 ?</text>

    <!-- Ветка ДА (вправо) -->
    <line x1="430" y1="235" x2="520" y2="235" stroke="#1a2c2a" stroke-width="2"></line>
    <text x="475" y="225" text-anchor="middle" font-size="14" fill="#b33" font-weight="bold">Да</text>

    <!-- Блок ошибки a=0 -->
    <rect x="520" y="215" width="130" height="40" rx="6" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="585" y="240" text-anchor="middle" font-size="13" font-family="'Times New Roman',serif">Ошибка: a = 0</text>

    <!-- Обходной путь (БЕЗ ЛИШНИХ ИЗГИБОВ) -->
    <!-- Сразу вниз из блока ошибки до уровня КОНЦА -->
    <line x1="585" y1="255" x2="585" y2="1180" stroke="#1a2c2a" stroke-width="2"></line>
    <!-- Влево к КОНЦУ (справа налево — СТРЕЛКА ОБЯЗАТЕЛЬНА) -->
    <line x1="585" y1="1180" x2="310" y2="1180" stroke="#1a2c2a" stroke-width="2" marker-end="url(#arrowRight)"></line>

    <!-- Ветка НЕТ (вниз) -->
    <line x1="300" y1="295" x2="300" y2="335" stroke="#1a2c2a" stroke-width="2"></line>
    <text x="315" y="322" font-size="14" fill="#2a7a32" font-weight="bold">Нет</text>

    <!-- ===== 4. arg = x / a ===== -->
    <rect x="200" y="335" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="362" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">arg = x / a</text>
    <line x1="300" y1="377" x2="300" y2="417" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 5. atan_val = arctg(arg) ===== -->
    <rect x="200" y="417" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="444" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">atan_val = arctg(arg)</text>
    <line x1="300" y1="459" x2="300" y2="499" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 6. tan_val = tg(atan_val+1) ===== -->
    <rect x="200" y="499" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="526" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">tan_val = tg(atan_val+1)</text>
    <line x1="300" y1="541" x2="300" y2="581" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 7. cos_val = cos(b*x) ===== -->
    <rect x="200" y="581" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="608" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">cos_val = cos(b·x)</text>
    <line x1="300" y1="623" x2="300" y2="663" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 8. chisl = tan_val - cos² ===== -->
    <rect x="200" y="663" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="690" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">chisl = tan_val - cos²</text>
    <line x1="300" y1="705" x2="300" y2="745" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 9. znam = (x-a)*(b²+a) ===== -->
    <rect x="200" y="745" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="772" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">znam = (x-a)·(b²+a)</text>
    <line x1="300" y1="787" x2="300" y2="827" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 10. РОМБ: znam == 0 ? ===== -->
    <polygon points="300,827 430,887 300,947 170,887" fill="white" stroke="#1a2c2a" stroke-width="2"></polygon>
    <text x="300" y="894" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">znam == 0 ?</text>

    <!-- Ветка ДА (вправо) -->
    <line x1="430" y1="887" x2="520" y2="887" stroke="#1a2c2a" stroke-width="2"></line>
    <text x="475" y="877" text-anchor="middle" font-size="14" fill="#b33" font-weight="bold">Да</text>

    <!-- Блок ошибки znam=0 -->
    <rect x="520" y="867" width="130" height="40" rx="6" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="585" y="892" text-anchor="middle" font-size="13" font-family="'Times New Roman',serif">Ошибка: znam=0</text>

    <!-- Обходной путь (БЕЗ ЛИШНИХ ИЗГИБОВ) -->
    <!-- Сразу вниз из блока ошибки до уровня КОНЦА -->
    <line x1="585" y1="907" x2="585" y2="1180" stroke="#1a2c2a" stroke-width="2"></line>
    <!-- Влево к КОНЦУ (справа налево — СТРЕЛКА ОБЯЗАТЕЛЬНА) -->
    <line x1="585" y1="1180" x2="310" y2="1180" stroke="#1a2c2a" stroke-width="2" marker-end="url(#arrowRight)"></line>

    <!-- Ветка НЕТ (вниз) -->
    <line x1="300" y1="947" x2="300" y2="987" stroke="#1a2c2a" stroke-width="2"></line>
    <text x="315" y="974" font-size="14" fill="#2a7a32" font-weight="bold">Нет</text>

    <!-- ===== 11. rez = chisl / znam ===== -->
    <rect x="200" y="987" width="200" height="42" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="300" y="1014" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">rez = chisl / znam</text>
    <line x1="300" y1="1029" x2="300" y2="1069" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 12. ВЫВОД ===== -->
    <polygon points="220,1069 400,1069 380,1114 200,1114" fill="white" stroke="#1a2c2a" stroke-width="2"></polygon>
    <text x="300" y="1099" text-anchor="middle" font-size="15" font-family="'Times New Roman',serif">Вывод rez</text>
    <line x1="300" y1="1114" x2="300" y2="1154" stroke="#1a2c2a" stroke-width="2"></line>

    <!-- ===== 13. КОНЕЦ ===== -->
    <rect x="210" y="1154" width="200" height="42" rx="21" fill="white" stroke="#1a2c2a" stroke-width="2"></rect>
    <text x="310" y="1181" text-anchor="middle" font-size="16" font-family="'Times New Roman',serif" font-weight="bold">КОНЕЦ</text>

</svg>